# Catches a broken `npm install -g @promptster/cli` on the pull request that
# breaks it, not at tag time. release.yml runs the same gate as a publish
# blocker; this one runs it while the change is still reviewable.
name: Packaging

# PR-only. The automerge gate requires this workflow's `install-check` on the PR
# before it squash-merges, and release.yml re-runs the same gate on the `v*`
# tag before it publishes, so nothing reads a run on main. The PR run tests the
# PR merged onto main as it was then; if two PRs land back to back, run this
# workflow by hand (workflow_dispatch) to check main.
on:
  pull_request:
  workflow_dispatch:

jobs:
  install-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Build all platform binaries
        run: node npm/scripts/build.js

      - name: Verify packaged binaries
        run: node npm/scripts/check-binaries.js

      - name: Verify the packed tarball installs a runnable promptster
        run: node npm/scripts/check-install.js

      # The automerge gate's decision test. It is what keeps REQUIRED_CHECKS
      # naming jobs that really exist — a required check that never reports is a
      # gate that never merges — so it runs inside a check the gate itself
      # requires. Node stdlib only; the scripts live at the repo root.
      - name: Automerge decision tests
        run: node --test scripts/__tests__/automerge-decision.test.mjs
